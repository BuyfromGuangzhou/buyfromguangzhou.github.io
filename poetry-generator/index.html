<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卓和创的诗歌生成器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
            background: #F5E6C8;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: #4A3728;
        }

        /* 宣纸纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(180, 160, 130, 0.03) 2px,
                    rgba(180, 160, 130, 0.03) 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 3px,
                    rgba(180, 160, 130, 0.02) 3px,
                    rgba(180, 160, 130, 0.02) 6px
                );
            pointer-events: none;
            z-index: 0;
        }

        /* 左侧竹子装饰 */
        .bamboo-left {
            position: fixed;
            left: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }

        /* 右侧梅花装饰 */
        .plum-right {
            position: fixed;
            right: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }

        .main-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 30px 20px 40px;
            position: relative;
            z-index: 2;
        }

        /* 标题区域 */
        .title-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .title-section h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 42px;
            color: #8B4513;
            text-shadow: 2px 2px 4px rgba(139, 69, 19, 0.15);
            margin-bottom: 6px;
            letter-spacing: 4px;
        }

        .title-section .subtitle {
            font-size: 16px;
            color: #A0855B;
            letter-spacing: 2px;
        }

        /* 小鸟装饰 */
        .bird-deco {
            display: inline-block;
            margin: 0 8px;
            vertical-align: middle;
        }

        /* 返回主页按钮 */
        .back-btn {
            display: inline-block;
            background: linear-gradient(135deg, #C4956A, #A07850);
            color: #FFF8E7;
            padding: 10px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 20px;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(139, 69, 19, 0.2);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
        }

        /* 模式切换标签 */
        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 25px;
        }

        .mode-tab {
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'ZCOOL KuaiLe', cursive;
            border: 2px solid #C4956A;
            background: rgba(255, 248, 231, 0.6);
            color: #8B4513;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-tab:first-child {
            border-radius: 25px 0 0 25px;
        }

        .mode-tab:last-child {
            border-radius: 0 25px 25px 0;
        }

        .mode-tab.active {
            background: linear-gradient(135deg, #C4956A, #A07850);
            color: #FFF8E7;
            border-color: #A07850;
        }

        /* 内容卡片 */
        .content-card {
            background: rgba(255, 248, 231, 0.85);
            border-radius: 20px;
            padding: 30px 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(139, 69, 19, 0.1);
            border: 1px solid rgba(196, 149, 106, 0.3);
            position: relative;
        }

        .content-card::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px dashed rgba(196, 149, 106, 0.25);
            border-radius: 16px;
            pointer-events: none;
        }

        /* 输入区域 */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 17px;
            color: #8B4513;
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #D4B896;
            border-radius: 15px;
            font-size: 16px;
            font-family: 'ZCOOL KuaiLe', cursive;
            color: #4A3728;
            background: rgba(255, 255, 255, 0.7);
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #C4956A;
            box-shadow: 0 0 10px rgba(196, 149, 106, 0.3);
        }

        .input-group textarea {
            height: 60px;
            resize: none;
        }

        /* 生成按钮 */
        .gen-btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-family: 'ZCOOL KuaiLe', cursive;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .gen-btn.acrostic {
            background: linear-gradient(135deg, #E8734A, #D4563A);
            color: #FFF8E7;
            box-shadow: 0 4px 15px rgba(232, 115, 74, 0.3);
        }

        .gen-btn.three-line {
            background: linear-gradient(135deg, #5BAE7C, #4A9A6B);
            color: #FFF8E7;
            box-shadow: 0 4px 15px rgba(91, 174, 124, 0.3);
        }

        .gen-btn:hover {
            transform: translateY(-2px);
        }

        .gen-btn:active {
            transform: translateY(0);
        }

        /* 诗歌展示区域 */
        .poem-display {
            margin-top: 20px;
            padding: 25px 20px;
            background: rgba(255, 252, 240, 0.9);
            border-radius: 15px;
            border: 1px solid rgba(196, 149, 106, 0.3);
            display: none;
            position: relative;
        }

        .poem-display.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poem-display .poem-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 24px;
            color: #8B4513;
            text-align: center;
            margin-bottom: 15px;
        }

        .poem-line {
            text-align: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            line-height: 2.2;
            color: #4A3728;
            margin: 5px 0;
        }

        .poem-line .first-char {
            color: #D4563A;
            font-weight: bold;
            font-size: 30px;
        }

        /* 拼音样式 */
        ruby {
            ruby-align: center;
        }

        ruby rt {
            font-size: 12px;
            color: #A0A0A0;
            font-family: 'Microsoft YaHei', sans-serif;
            letter-spacing: 0;
        }

        .poem-line ruby rt {
            font-size: 13px;
        }

        /* 收藏按钮 */
        .save-btn {
            display: block;
            margin: 15px auto 0;
            padding: 10px 28px;
            font-size: 17px;
            font-family: 'ZCOOL KuaiLe', cursive;
            border: 2px dashed #C4956A;
            border-radius: 20px;
            background: rgba(255, 248, 231, 0.8);
            color: #8B4513;
            cursor: pointer;
            transition: all 0.3s;
        }

        .save-btn:hover {
            background: #C4956A;
            color: #FFF8E7;
            border-style: solid;
        }

        /* 诗集区域 */
        .collection-section {
            margin-top: 30px;
        }

        .collection-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .collection-header h2 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 30px;
            color: #8B4513;
        }

        /* 诗集本背景 */
        .collection-book {
            background:
                linear-gradient(135deg, rgba(255, 248, 231, 0.9), rgba(245, 230, 200, 0.9));
            border-radius: 20px;
            padding: 25px 20px;
            border: 2px solid #D4B896;
            box-shadow:
                0 4px 20px rgba(139, 69, 19, 0.1),
                inset 0 0 30px rgba(196, 149, 106, 0.1);
            position: relative;
            min-height: 100px;
        }

        /* 书脊效果 */
        .collection-book::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: rgba(196, 149, 106, 0.3);
            transform: translateX(-50%);
        }

        .empty-collection {
            text-align: center;
            color: #B8A080;
            font-size: 16px;
            padding: 20px;
        }

        /* 诗歌卡片 */
        .poem-card {
            background: rgba(255, 252, 240, 0.95);
            border-radius: 15px;
            padding: 18px 36px 18px 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(196, 149, 106, 0.3);
            position: relative;
            box-shadow: 0 2px 8px rgba(139, 69, 19, 0.08);
            animation: cardIn 0.4s ease;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .poem-card .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .poem-card .card-type {
            font-size: 13px;
            padding: 3px 12px;
            border-radius: 12px;
            color: #FFF8E7;
        }

        .card-type.acrostic-tag {
            background: linear-gradient(135deg, #E8734A, #D4563A);
        }

        .card-type.three-line-tag {
            background: linear-gradient(135deg, #5BAE7C, #4A9A6B);
        }

        .poem-card .card-theme {
            font-size: 14px;
            color: #A0855B;
        }

        .poem-card .card-poem {
            text-align: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 22px;
            line-height: 2.0;
            color: #4A3728;
        }

        .poem-card .card-poem .first-char {
            color: #D4563A;
            font-weight: bold;
        }

        .poem-card .card-poem ruby rt {
            font-size: 11px;
        }

        .delete-btn {
            position: absolute;
            top: 2px;
            right: 12px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #D4B896;
            background: rgba(255, 248, 231, 0.8);
            color: #C4956A;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            line-height: 1;
        }

        .delete-btn:hover {
            background: #D4563A;
            color: #FFF8E7;
            border-color: #D4563A;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #B8A080;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* 生成中动画 */
        .generating {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .generating.visible {
            display: block;
        }

        .ink-drop {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #8B4513;
            margin: 0 5px;
            animation: inkDrop 1.2s infinite ease-in-out;
        }

        .ink-drop:nth-child(2) { animation-delay: 0.2s; }
        .ink-drop:nth-child(3) { animation-delay: 0.4s; }

        @keyframes inkDrop {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* 浮动花瓣装饰 */
        .floating-petal {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .main-container {
                padding: 20px 12px 30px;
            }
            .title-section h1 {
                font-size: 32px;
            }
            .poem-line {
                font-size: 24px;
            }
            .bamboo-left, .plum-right {
                width: 40px;
                opacity: 0.2;
            }
        }
    </style>
</head>

<div class="main-container">

    <!-- 标题 -->
    <div class="title-section">
        <h1>
            <span class="bird-deco">
                <svg width="28" height="22" viewBox="0 0 28 22"><ellipse cx="14" cy="12" rx="10" ry="7" fill="#8B6B5A" opacity="0.7"/><circle cx="8" cy="8" r="5" fill="#8B6B5A" opacity="0.7"/><circle cx="6.5" cy="7" r="1.5" fill="#FFF8E7"/><path d="M3 8 L-1 7 L3 9" fill="#E8734A" opacity="0.7"/><path d="M21 10 Q27 2 25 -3" stroke="#8B6B5A" stroke-width="1.5" fill="none" opacity="0.7"/></svg>
            </span>
            诗歌生成器
            <span class="bird-deco">
                <svg width="28" height="22" viewBox="0 0 28 22"><ellipse cx="14" cy="12" rx="10" ry="7" fill="#8B6B5A" opacity="0.7"/><circle cx="20" cy="8" r="5" fill="#8B6B5A" opacity="0.7"/><circle cx="21.5" cy="7" r="1.5" fill="#FFF8E7"/><path d="M25 8 L29 7 L25 9" fill="#E8734A" opacity="0.7"/><path d="M7 10 Q1 2 3 -3" stroke="#8B6B5A" stroke-width="1.5" fill="none" opacity="0.7"/></svg>
            </span>
        </h1>
        <div class="subtitle">卓和创 · 笔下生花</div>
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
        <div class="mode-tab active" onclick="switchMode('acrostic')">藏头诗</div>
        <div class="mode-tab" onclick="switchMode('three-line')">三行诗</div>
    </div>

    <!-- 藏头诗模式 -->
    <div id="acrostic-mode" class="content-card">
        <div class="input-group">
            <label>请输入你想藏的字或词</label>
            <input type="text" id="acrostic-chars" placeholder="比如：卓和创" maxlength="8">
        </div>
        <div class="input-group">
            <label>请描述你想要的画面或主题</label>
            <input type="text" id="acrostic-theme" placeholder="比如：春天的花园">
        </div>
        <button class="gen-btn acrostic" onclick="generateAcrostic()">生成藏头诗</button>
        <div class="generating" id="acrostic-loading">
            <span class="ink-drop"></span>
            <span class="ink-drop"></span>
            <span class="ink-drop"></span>
        </div>
        <div class="poem-display" id="acrostic-result"></div>
    </div>

    <!-- 三行诗模式 -->

// 获取拼音
function getPinyin(char) {
    if (PINYIN_DICT[char]) return PINYIN_DICT[char];
    // 对于多音字或未收录的字，返回空
    return '';
}

// 给文字添加拼音ruby标签
function addRuby(text, highlightFirst) {
    let html = '';
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === ' ' || ch === '，' || ch === '。' || ch === '！' || ch === '？' || ch === '、' || ch === '；' || ch === '：') {
            html += ch;
        } else {
            const py = getPinyin(ch);
            const isFirst = highlightFirst && i === 0;
            if (isFirst) {
                html += `<ruby><span class="first-char">${ch}</span><rp>(</rp><rt>${py}</rt><rp>)</rp></ruby>`;
            } else {
                html += `<ruby>${ch}<rp>(</rp><rt>${py}</rt><rp>)</rp></ruby>`;
            }
        }
    }
    return html;
}

// 给文字添加拼音ruby标签（不带高亮）
function addRubyPlain(text) {
    let html = '';
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === ' ' || ch === '，' || ch === '。' || ch === '！' || ch === '？' || ch === '、' || ch === '；' || ch === '：') {
            html += ch;
        } else {
            const py = getPinyin(ch);
            html += `<ruby>${ch}<rp>(</rp><rt>${py}</rt><rp>)</rp></ruby>`;
        }
    }
    return html;
}

// ===== 当前状态 =====
function loadPoemCollection() {
    try {
        const parsed = JSON.parse(localStorage.getItem('poem-collection') || '[]');
        return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
        return [];
    }
}

function persistPoemCollection() {
    try {
        localStorage.setItem('poem-collection', JSON.stringify(collection));
        return true;
    } catch (error) {
        alert('诗集保存空间不足，请先删除一些旧收藏。');
        return false;
    }
}

let currentMode = 'acrostic';
let currentPoem = null; // { type, theme, lines }
let collection = loadPoemCollection();

// ===== 模式切换 =====
function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active'));
    if (mode === 'acrostic') {
        document.querySelectorAll('.mode-tab')[0].classList.add('active');
        document.getElementById('acrostic-mode').style.display = '';
        document.getElementById('three-line-mode').style.display = 'none';
    } else {
        document.querySelectorAll('.mode-tab')[1].classList.add('active');
        document.getElementById('acrostic-mode').style.display = 'none';
        document.getElementById('three-line-mode').style.display = '';
    }
}

// ===== 藏头诗生成 =====
function generateAcrostic() {
    const chars = document.getElementById('acrostic-chars').value.trim();
    const theme = document.getElementById('acrostic-theme').value.trim();

    if (!chars) {
        alert('请输入你想藏的字或词！');
        return;
    }
    if (!theme) {
        alert('请描述你想要的画面或主题！');
        return;
    }

    // 显示加载动画
    document.getElementById('acrostic-loading').classList.add('visible');
    document.getElementById('acrostic-result').classList.remove('visible');

    setTimeout(() => {
        const lines = [];
        for (let i = 0; i < chars.length; i++) {
            const ch = chars[i];
            let line;
            if (ACROSTIC_LINES[ch]) {
                const candidates = ACROSTIC_LINES[ch];
                line = candidates[Math.floor(Math.random() * candidates.length)];
            } else {
                const template = GENERIC_LINES[Math.floor(Math.random() * GENERIC_LINES.length)];
                line = template.replace('{char}', ch);
            }
            lines.push(line);
        }

        currentPoem = { type: 'acrostic', theme: theme, chars: chars, lines: lines };
        displayAcrosticPoem(lines, chars);

        document.getElementById('acrostic-loading').classList.remove('visible');
    }, 1200);
}

function displayAcrosticPoem(lines, chars) {
    const container = document.getElementById('acrostic-result');
    let html = '<div class="poem-title">藏头诗 · ' + chars + '</div>';
    for (let i = 0; i < lines.length; i++) {
        html += '<div class="poem-line">' + addRuby(lines[i], true) + '</div>';
    }
    html += '<button class="save-btn" onclick="saveToCollection(event)">收藏到诗集</button>';
    container.innerHTML = html;
    container.classList.add('visible');
}

// ===== 三行诗生成 =====
function generateThreeLine() {
    const theme = document.getElementById('three-line-theme').value.trim();

    if (!theme) {
        alert('请描述你想要的画面或主题！');
        return;
    }

    document.getElementById('three-line-loading').classList.add('visible');
    document.getElementById('three-line-result').classList.remove('visible');

    setTimeout(() => {
        const lines = generateThreeLinePoem(theme);
        currentPoem = { type: 'three-line', theme: theme, lines: lines };
        displayThreeLinePoem(lines);

        document.getElementById('three-line-loading').classList.remove('visible');
    }, 1000);
}

function generateThreeLinePoem(theme) {
    // 匹配主题关键词
    let template = null;
    for (const key in THREE_LINE_TEMPLATES) {
        if (theme.includes(key)) {
            template = THREE_LINE_TEMPLATES[key];
            break;
        }
    }

    if (!template) {
        template = GENERIC_THREE_LINE;
    }

    const seeLine = template.see[Math.floor(Math.random() * template.see.length)];
    const hearLine = template.hear[Math.floor(Math.random() * template.hear.length)];
    const feelLine = template.feel[Math.floor(Math.random() * template.feel.length)];

    return [
        '我看见：' + seeLine,
        '我听见：' + hearLine,
        '我感到：' + feelLine
    ];
}

function displayThreeLinePoem(lines) {
    const container = document.getElementById('three-line-result');
    let html = '<div class="poem-title">三行诗</div>';
    html += '<div class="poem-line">' + addRuby(lines[0], false) + '</div>';
    html += '<div class="poem-line">' + addRuby(lines[1], false) + '</div>';
    html += '<div class="poem-line">' + addRuby(lines[2], false) + '</div>';
    html += '<button class="save-btn" onclick="saveToCollection(event)">收藏到诗集</button>';
    container.innerHTML = html;
    container.classList.add('visible');
}

// ===== 诗集功能 =====
function saveToCollection(e) {
    if (!currentPoem) return;

    const poem = {
        id: Date.now(),
        type: currentPoem.type,
        theme: currentPoem.theme,
        lines: currentPoem.lines,
        chars: currentPoem.chars || '',
        time: new Date().toLocaleString('zh-CN')
    };

    collection.push(poem);
    if (!persistPoemCollection()) {
        collection.pop();
        return;
    }
    renderCollection();

    // 收藏按钮反馈
    const btn = e.currentTarget;
    btn.textContent = '已收藏！';
    btn.style.background = '#C4956A';
    btn.style.color = '#FFF8E7';
    btn.style.borderStyle = 'solid';
    setTimeout(() => {
        btn.textContent = '收藏到诗集';
        btn.style.background = '';
        btn.style.color = '';
        btn.style.borderStyle = '';
    }, 1500);
}

function deleteFromCollection(id) {
    const previousCollection = collection;
    collection = collection.filter(p => p.id !== id);
    if (!persistPoemCollection()) {
        collection = previousCollection;
        return;
    }
    renderCollection();
}

function renderCollection() {
    const container = document.getElementById('collection-book');
    const emptyMsg = document.getElementById('empty-msg');

    if (collection.length === 0) {
        container.innerHTML = '<div class="empty-collection" id="empty-msg">还没有收藏诗歌，快去生成一首吧！</div>';
        return;
    }

    let html = '';
    // 按时间倒序
    const sorted = [...collection].reverse();
    for (const poem of sorted) {
        const typeLabel = poem.type === 'acrostic' ? '藏头诗' : '三行诗';
        const typeClass = poem.type === 'acrostic' ? 'acrostic-tag' : 'three-line-tag';

        html += '<div class="poem-card">';
        html += '<button class="delete-btn" onclick="deleteFromCollection(' + poem.id + ')" title="删除">&times;</button>';
        html += '<div class="card-meta">';
        html += '<span class="card-type ' + typeClass + '">' + typeLabel + '</span>';
        html += '<span class="card-theme">' + poem.theme + '</span>';
        html += '</div>';
        html += '<div class="card-poem">';
        for (let i = 0; i < poem.lines.length; i++) {
            const isAcrostic = poem.type === 'acrostic';
            html += addRuby(poem.lines[i], isAcrostic);
            if (i < poem.lines.length - 1) html += '<br>';
        }
        html += '</div>';
        html += '</div>';
    }

    container.innerHTML = html;
}

// 初始渲染诗集
renderCollection();

// ===== 浮动花瓣 =====
function createPetal() {
    const petal = document.createElement('div');
    petal.className = 'floating-petal';
    const size = 15 + Math.random() * 20;
    const startX = Math.random() * window.innerWidth;
    const duration = 8 + Math.random() * 10;

    petal.style.cssText = `
        left: ${startX}px;
        top: -30px;
        width: ${size}px;
        height: ${size}px;
        animation: petalFall ${duration}s linear forwards;
    `;

    // 随机花瓣SVG
    const hue = Math.random() > 0.5 ? '350' : '30';
    petal.innerHTML = `<svg viewBox="0 0 20 20" width="${size}" height="${size}"><ellipse cx="10" cy="10" rx="8" ry="5" fill="hsl(${hue},70%,80%)" transform="rotate(${Math.random()*360} 10 10)"/></svg>`;

    document.body.appendChild(petal);
    setTimeout(() => petal.remove(), duration * 1000);
}

// 添加花瓣动画CSS
const style = document.createElement('style');
style.textContent = `
    @keyframes petalFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
        50% { opacity: 0.2; }
        100% { transform: translateY(${window.innerHeight + 60}px) rotate(720deg); opacity: 0; }
    }
`;
document.head.appendChild(style);

// 定期生成花瓣
setInterval(createPetal, 3000);
setTimeout(createPetal, 500);
</script>
